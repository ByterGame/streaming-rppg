<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming rPPG — live heart rate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090d;
  --panel:#111722;
  --panel-2:#0c1119;
  --line:#253044;
  --text:#f2f7fb;
  --muted:#8d9aad;
  --soft:#5f6f86;
  --accent:#22d690;
  --accent-2:#31a8ff;
  --warn:#f2c94c;
  --bad:#ff5f6d;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body{background:linear-gradient(135deg,#06080c 0%,#0b1018 45%,#07090d 100%)}
.page{display:grid;grid-template-rows:auto minmax(0,1fr);width:100%;height:100%;padding:18px;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 28px rgba(34,214,144,.22)}
.title{font-size:17px;font-weight:700;letter-spacing:0;white-space:nowrap}
.subtitle{margin-top:2px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-badge{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid rgba(34,214,144,.35);
  border-radius:999px;background:rgba(34,214,144,.08);color:#bfffe2;font-size:12px;font-weight:650}
.live-dot{width:7px;height:7px;border-radius:999px;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;min-height:0}
.video-wrap{position:relative;min-height:0;background:#000;overflow:hidden;border:1px solid var(--line);
  border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.38)}
#video{display:none}
#display{width:100%;height:100%;object-fit:contain}
.overlay-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(7,9,13,.96),rgba(14,20,30,.92));z-index:10}
#start-btn{padding:18px 42px;border:1px solid rgba(34,214,144,.55);border-radius:8px;background:rgba(34,214,144,.12);
  color:#eafff6;font-size:18px;font-weight:750;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;
  box-shadow:0 16px 46px rgba(34,214,144,.16)}
#start-btn:hover{background:rgba(34,214,144,.18);transform:translateY(-1px)}
.overlay-msg.hidden{display:none}
.info{min-width:0;padding:16px;background:linear-gradient(180deg,rgba(17,23,34,.96),rgba(10,15,23,.96));
  border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 24px 80px rgba(0,0,0,.28)}
.section-label{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:0;text-transform:uppercase}
.hr-card{padding:16px;border:1px solid rgba(34,214,144,.24);border-radius:8px;background:
  linear-gradient(180deg,rgba(34,214,144,.10),rgba(34,214,144,.035))}
.hr-row{display:flex;align-items:flex-end;gap:12px}
#hr-value{font-size:82px;font-weight:850;color:var(--accent);line-height:.88;letter-spacing:0;font-variant-numeric:tabular-nums}
#hr-unit{padding-bottom:8px;font-size:18px;color:#a9b8c8;font-weight:700}
#status{min-height:38px;margin-top:13px;font-size:14px;line-height:1.35;color:#c3cfdd}
#detail{min-height:34px;font-size:13px;line-height:1.3;color:var(--muted)}
#hr-value.stale{color:var(--warn)}
.quality{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{min-width:0;font-size:12px;line-height:1;padding:10px 11px;border-radius:8px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:rgba(34,214,144,.10);border-color:rgba(34,214,144,.24);color:#a8f8d6}
.pill.warn{background:rgba(242,201,76,.11);border-color:rgba(242,201,76,.25);color:#ffe08a}
.pill.bad{background:rgba(255,95,109,.12);border-color:rgba(255,95,109,.27);color:#ff9da6}
.wave-panel{padding:12px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:var(--panel-2)}
#waveform{width:100%;height:110px;margin-top:10px;background:#080c12;border-radius:8px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.04)}
.metric b{display:block;font-size:16px;color:#f8fbff;font-variant-numeric:tabular-nums}
.metric span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
@media(max-width:960px){
  html,body{overflow:hidden}
  .page{height:100%;min-height:0;padding:8px;gap:8px;grid-template-rows:auto minmax(0,1fr)}
  .topbar{min-height:34px;gap:8px}
  .brand{gap:8px}
  .mark{width:28px;height:28px;border-radius:6px}
  .title{font-size:14px}
  .subtitle,.live-badge{display:none}
  .workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .video-wrap{min-height:0}
  .info{min-height:0;padding:10px;gap:8px}
  .section-label{display:none}
  .hr-card{padding:10px}
  .hr-row{gap:8px}
  #hr-value{font-size:44px;line-height:.9}
  #hr-unit{padding-bottom:4px;font-size:13px}
  #status{min-height:0;margin-top:7px;font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #detail{display:none}
  .quality{grid-template-columns:1fr 1fr;gap:6px}
  .pill{padding:8px 9px;font-size:11px;border-radius:7px}
  .meta-grid{display:none}
  .wave-panel{padding:8px}
  #waveform{height:48px;margin-top:0}
}
@media(max-height:680px) and (min-width:961px){
  .page{padding:10px;gap:10px}.workspace{gap:10px}.topbar{min-height:38px}
  #hr-value{font-size:56px}.info{gap:9px;padding:12px}#waveform{height:60px}
}
</style>

<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <div class="title">Streaming rPPG monitor</div>

      </div>
    </div>

  </header>
  <main class="workspace">
    <div class="video-wrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="display"></canvas>
      <div class="overlay-msg" id="overlay">
        <button id="start-btn">Start measurement</button>
      </div>
    </div>
    <aside class="info">
      <div class="section-label">Current estimate</div>

          <span id="hr-value">--</span>
          <span id="hr-unit">bpm</span>
        </div>

        <div id="detail"></div>
      </section>
      <div class="section-label">Signal quality</div>
      <div class="quality">

        <div class="metric"><b id="method-metric">POS</b><span>primary method</span></div>
      </div>
      <section class="wave-panel">
        <div class="section-label">Filtered pulse trace</div>
        <canvas id="waveform"></canvas>
      </section>
    </aside>
  </main>
</div>

<script type="module">
import {
  FilesetResolver, FaceLandmarker,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

const video     = document.getElementById("video");
const display   = document.getElementById("display");
const overlay   = document.getElementById("overlay");
const startBtn  = document.getElementById("start-btn");
const hrValue   = document.getElementById("hr-value");
const statusEl  = document.getElementById("status");
const detailEl  = document.getElementById("detail");
const waveCvs   = document.getElementById("waveform");
const facePill   = document.getElementById("face-pill");
const lightPill  = document.getElementById("light-pill");
const fpsPill    = document.getElementById("fps-pill");
const signalPill = document.getElementById("signal-pill");
const bufferMetric = document.getElementById("buffer-metric");
const methodMetric = document.getElementById("method-metric");

const ctx  = display.getContext("2d", {willReadFrequently:true});
const wctx = waveCvs.getContext("2d");

const FS      = 30;
const WIN_SEC = 10;
const WIN     = FS * WIN_SEC;   // 300 samples
const POS_SEC = 1.6;
const POS_L   = Math.round(FS * POS_SEC);
const HR_LOW  = 0.7;
const HR_HIGH = 3.3;
const MIN_GOOD_SEC = 8;
const PRIOR_TTL_SEC = 45;

let landmarker = null;
let rawBuf     = [];
let firstHr    = true;
let audioCtx   = null;
let hrHistory  = [];
let prevVts    = null;
let fpsEma     = 30;
let totalFrames = 0;
let lastAnalysisAt = 0;
let lastFaceCenter = null;
let lastGoodBpm = NaN;
let lastGoodAt = 0;
let lastDisplayedBpm = NaN;
let pendingBpm = NaN;
let pendingAt = 0;
let smoothMask = null;

const ext = document.createElement("canvas");
const ectx = ext.getContext("2d", {willReadFrequently:true});

function beep(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type="sine";o.frequency.value=880;
  g.gain.setValueAtTime(.3,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);
  o.start();o.stop(audioCtx.currentTime+.25);
}

// POS signal — overlap-add matching baseline_pipeline.py
function posSignal(R,G,B,L){
  const n=R.length;if(n<L)return new Float64Array(n);
  const H=new Float64Array(n);
  const Wsum=new Float64Array(n);
  for(let nn=L-1;nn<n;nn++){
    const m=nn-L+1;
    let mR=0,mG=0,mB=0;
    for(let i=m;i<=nn;i++){mR+=R[i];mG+=G[i];mB+=B[i]}
    mR/=L;mG/=L;mB/=L;
    if(mR===0)mR=1;if(mG===0)mG=1;if(mB===0)mB=1;
    let v1=0,v2=0;
    const s1=new Float64Array(L),s2=new Float64Array(L);
    for(let i=0;i<L;i++){
      const cR=R[m+i]/mR,cG=G[m+i]/mG,cB=B[m+i]/mB;
      s1[i]=cG-cB;s2[i]=-2*cR+cG+cB;
      v1+=s1[i];v2+=s2[i];
    }
    const mean1=v1/L,mean2=v2/L;
    let sd1=0,sd2=0;
    for(let i=0;i<L;i++){sd1+=(s1[i]-mean1)**2;sd2+=(s2[i]-mean2)**2}
    sd1=Math.sqrt(sd1/L);sd2=Math.sqrt(sd2/L);
    const alpha=sd2>0?sd1/sd2:0;
    for(let i=0;i<L;i++){H[m+i]+=s1[i]+alpha*s2[i];Wsum[m+i]++}
  }
  for(let i=0;i<n;i++) if(Wsum[i]>0) H[i]/=Wsum[i];
  return H;
}

function chromSignal(R,G,B){
  const n=R.length;
  const out=new Float64Array(n);
  if(n<2)return out;
  let mR=0,mG=0,mB=0;
  for(let i=0;i<n;i++){mR+=R[i];mG+=G[i];mB+=B[i]}
  mR/=n;mG/=n;mB/=n;
  if(mR===0)mR=1;if(mG===0)mG=1;if(mB===0)mB=1;
  const X=new Float64Array(n),Y=new Float64Array(n);
  let mx=0,my=0;
  for(let i=0;i<n;i++){
    const rn=R[i]/mR,gn=G[i]/mG,bn=B[i]/mB;
    X[i]=3*rn-2*gn;
    Y[i]=1.5*rn+gn-1.5*bn;
    mx+=X[i];my+=Y[i];
  }
  mx/=n;my/=n;
  let sx=0,sy=0;
  for(let i=0;i<n;i++){sx+=(X[i]-mx)**2;sy+=(Y[i]-my)**2}
  sx=Math.sqrt(sx/n);sy=Math.sqrt(sy/n);
  const alpha=sy>0?sx/sy:0;
  for(let i=0;i<n;i++)out[i]=X[i]-alpha*Y[i];
  return out;
}

function detrend(x){
  const n=x.length;if(n<2)return x.slice();
  let sx=0,st=0,stt=0,sxt=0;
  for(let i=0;i<n;i++){sx+=x[i];st+=i;stt+=i*i;sxt+=i*x[i]}
  const d=n*stt-st*st;if(Math.abs(d)<1e-12)return x.slice();
  const a=(n*sxt-st*sx)/d,b=(stt*sx-st*sxt)/d;
  const y=new Float64Array(n);
  for(let i=0;i<n;i++)y[i]=x[i]-(a*i+b);
  return y;
}

// 2nd-order biquad bandpass, forward-backward (zero-phase)
function butterBpf(x,lo,hi,fs){
  const n=x.length;if(n<8)return x.slice();
  const w0=Math.PI*(lo+hi)/fs,bw=Math.PI*(hi-lo)/fs;
  const sinW=Math.sin(w0),cosW=Math.cos(w0),sinB=Math.sin(bw),alpha=sinB/2;
  const a0=1+alpha,a1=-2*cosW,a2=1-alpha;
  const s={b0:alpha/a0,b1:0,b2:-alpha/a0,a1:a1/a0,a2:a2/a0};
  function biquad(v){
    const y=new Float64Array(n);let z1=0,z2=0;
    for(let i=0;i<n;i++){
      const t=v[i]-s.a1*z1-s.a2*z2;
      y[i]=s.b0*t+s.b1*z1+s.b2*z2;z2=z1;z1=t;
    }return y;
  }
  let y=biquad(x);
  const rev=new Float64Array(n);for(let i=0;i<n;i++)rev[i]=y[n-1-i];
  y=biquad(rev);
  const out=new Float64Array(n);for(let i=0;i<n;i++)out[i]=y[n-1-i];
  return out;
}

function fft(re,im){
  const N=re.length;
  for(let i=1,j=0;i<N;i++){
    let b=N>>1;for(;j&b;b>>=1)j^=b;j^=b;
    if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}
  }
  for(let len=2;len<=N;len*=2){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<N;i+=len){
      let cr=1,ci=0;
      for(let j=0;j<len/2;j++){
        const p=i+j,q=p+len/2;
        const ur=cr*re[q]-ci*im[q],ui=cr*im[q]+ci*re[q];
        re[q]=re[p]-ur;im[q]=im[p]-ui;
        re[p]+=ur;im[p]+=ui;
        const tr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=tr;
      }
    }
  }
}

function peakFreq(sig,fs,lo,hi,prevBpm=NaN){
  const N=1<<Math.ceil(Math.log2(sig.length));
  const re=new Float64Array(N),im=new Float64Array(N);
  for(let i=0;i<sig.length;i++){
    const win=0.5-0.5*Math.cos((2*Math.PI*i)/(sig.length-1));
    re[i]=sig[i]*win;
  }
  fft(re,im);
  const res=fs/N;
  const iLo=Math.max(1,Math.ceil(lo/res));
  const iHi=Math.min(N/2-1,Math.floor(hi/res));
  if(iLo>=iHi)return{bpm:NaN,snr:0};
  const powers=[];
  for(let i=iLo;i<=iHi;i++){
    const p=re[i]*re[i]+im[i]*im[i];
    powers.push(p);
  }
  const sortedPowers=powers.slice().sort((a,b)=>a-b);
  const medianPow=sortedPowers[Math.floor(sortedPowers.length/2)]||1e-12;
  function goertzel(f){
    const w=2*Math.PI*f/fs,coeff=2*Math.cos(w);
    let s0=0,s1=0,s2=0;
    for(let i=0;i<sig.length;i++){s0=sig[i]+coeff*s1-s2;s2=s1;s1=s0}
    return s1*s1+s2*s2-coeff*s1*s2;
  }

  function normAutocorr(testBpm){
    const n=sig.length;
    const lag=Math.round(fs*60/testBpm);
    if(lag<2||lag>=n)return 0;
    let ac=0,var_=0,m=0;
    for(let i=0;i<n;i++)m+=sig[i];m/=n;
    for(let i=0;i<n;i++)var_+=(sig[i]-m)**2;
    if(var_<=0)return 0;
    for(let i=0;i<n-lag;i++) ac+=(sig[i]-m)*(sig[i+lag]-m);
    return ac/var_;
  }

  function refineBin(bin){
    let fl=Math.max(lo,(bin-1)*res),fh=Math.min(hi,(bin+1)*res);
    for(let k=0;k<12;k++){
      const m1=fl+(fh-fl)/3,m2=fh-(fh-fl)/3;
      if(goertzel(m1)>goertzel(m2))fh=m2;else fl=m1;
    }
    return (fl+fh)/2;
  }

  const peaks=[];
  for(let i=iLo+1;i<iHi;i++){
    const p=re[i]*re[i]+im[i]*im[i];
    const pl=re[i-1]*re[i-1]+im[i-1]*im[i-1];
    const pr=re[i+1]*re[i+1]+im[i+1]*im[i+1];
    if(p>=pl&&p>=pr)peaks.push({bin:i,power:p});
  }
  if(!peaks.length){
    for(let i=iLo;i<=iHi;i++)peaks.push({bin:i,power:re[i]*re[i]+im[i]*im[i]});
  }
  peaks.sort((a,b)=>b.power-a.power);

  const byBpm=new Map();
  function addCandidate(freq,source){
    if(freq<lo||freq>hi)return;
    const bpm=freq*60;
    const key=Math.round(bpm);
    const power=goertzel(freq);
    const ac=normAutocorr(bpm);
    const prevPenalty=isFinite(prevBpm)?Math.min(Math.abs(bpm-prevBpm)/35,2):0;
    const score=Math.log(Math.max(power,1e-12)/medianPow)+2.5*Math.max(0,ac)-prevPenalty;
    const cand={bpm,power,ac,score,source};
    const old=byBpm.get(key);
    if(!old||cand.score>old.score)byBpm.set(key,cand);
  }

  for(const p of peaks.slice(0,8)){
    const f=refineBin(p.bin);
    addCandidate(f,"peak");
    addCandidate(f/2,"subharmonic");
  }

  const candidates=[...byBpm.values()];
  for(const high of candidates){
    if(high.bpm<95)continue;
    const low=candidates.find(c=>Math.abs(c.bpm*2-high.bpm)<6);
    if(!low)continue;
    const lowSupport=low.ac>=high.ac*0.65||low.power>=high.power*0.22;
    if(lowSupport){
      high.score-=1.0;
      low.score+=0.7;
    }
  }

  candidates.sort((a,b)=>b.score-a.score);
  const best=candidates[0];
  if(!best)return{bpm:NaN,snr:0};
  const rival=candidates.find(c=>c!==best && (
    Math.abs(c.bpm*2-best.bpm)<6 ||
    Math.abs(c.bpm-best.bpm*2)<6 ||
    Math.abs(c.bpm-best.bpm)<12
  ));
  const ambiguous=!!rival && rival.score>best.score-1.15;
  return{
    bpm:best.bpm,
    snr:best.power/medianPow,
    candidates:candidates.slice(0,4),
    ambiguous,
    rivalBpm:rival?rival.bpm:NaN
  };
}

function chooseDisplayPeak(pos, chromPeak, recentPrior){
  const out={
    bpm:pos.bpm,
    snr:pos.snr,
    adjusted:false,
    rawBpm:pos.bpm,
    halfBpm:NaN,
    reason:"POS"
  };
  if(!isFinite(pos.bpm)||pos.bpm<=95||!pos.candidates)return out;

  const target=pos.bpm/2;
  const half=pos.candidates
    .filter(c=>c.bpm>=42&&c.bpm<=95&&Math.abs(c.bpm-target)<=7)
    .sort((a,b)=>b.score-a.score)[0];
  if(!half)return out;

  const chromBpm=chromPeak&&isFinite(chromPeak.bpm)?chromPeak.bpm:NaN;
  const chromSupportsHalf=isFinite(chromBpm)&&Math.abs(chromBpm-half.bpm)<=12;
  const priorSupportsHalf=isFinite(recentPrior)&&Math.abs(recentPrior-half.bpm)<=14;
  const autocorrSupport=half.ac>=0.02 || half.ac>=Math.max(0,pos.candidates[0]?.ac||0)*0.45;
  const powerSupport=half.power>=Math.max(1e-12,pos.candidates[0]?.power||1e-12)*0.12;
  const scoreClose=half.score>=(pos.candidates[0]?.score??0)-2.2;
  const hasAnyConfidence=chromSupportsHalf||priorSupportsHalf||autocorrSupport||powerSupport||scoreClose;

  if(hasAnyConfidence){
    out.bpm=half.bpm;
    out.snr=pos.snr;
    out.adjusted=true;
    out.halfBpm=half.bpm;
    out.reason="subharmonic lock";
  }
  return out;
}

function resampleUniform(samples, fs, seconds){
  if(samples.length<2)return null;
  const end=samples[samples.length-1].t;
  const start=end-seconds;
  if(samples[0].t>start+0.25)return null;
  const n=Math.round(seconds*fs);
  const R=new Float64Array(n),G=new Float64Array(n),B=new Float64Array(n);
  let j=0;
  for(let i=0;i<n;i++){
    const t=start+i/fs;
    while(j<samples.length-2 && samples[j+1].t<t)j++;
    const a=samples[j],b=samples[Math.min(j+1,samples.length-1)];
    const span=Math.max(1e-6,b.t-a.t);
    const u=Math.min(1,Math.max(0,(t-a.t)/span));
    R[i]=a.r+(b.r-a.r)*u;
    G[i]=a.g+(b.g-a.g)*u;
    B[i]=a.b+(b.b-a.b)*u;
  }
  return{R,G,B};
}

function setPill(el,label,state){
  el.textContent=label;
  el.className=`pill ${state}`;
}

function smoothPoly(poly){
  if(!smoothMask||smoothMask.length!==poly.length){
    smoothMask=poly.map(p=>({x:p.x,y:p.y}));
    return smoothMask;
  }
  const a=0.28;
  for(let i=0;i<poly.length;i++){
    smoothMask[i].x=smoothMask[i].x*(1-a)+poly[i].x*a;
    smoothMask[i].y=smoothMask[i].y*(1-a)+poly[i].y*a;
  }
  return smoothMask;
}

function markBpmStale(){
  if(isFinite(lastDisplayedBpm)){
    hrValue.textContent=Math.round(lastDisplayedBpm);
    hrValue.classList.add("stale");
  }else{
    hrValue.textContent="--";
    hrValue.classList.remove("stale");
  }
}

function showFreshBpm(bpm){
  lastDisplayedBpm=bpm;
  hrValue.textContent=Math.round(bpm);
  hrValue.classList.remove("stale");
}

function setDetail(text,state=""){
  detailEl.textContent=text;
  detailEl.style.color=state==="warn"?"#ffcc00":state==="ok"?"#00ff88":"#999";
}

function uiBpm(bpm){
  if(!isFinite(bpm))return "--";
  return Math.round(bpm>95?bpm/2:bpm);
}

function drawFaceGuide(W,H,quality,msg){
  const size=Math.min(W,H)*0.46;
  const x=(W-size)/2,y=(H-size*1.18)/2;
  const color=quality==="ok"?"#00ff88":quality==="warn"?"#ffcc00":"#ff4d4d";
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash([12,8]);
  ctx.strokeRect(x,y,size,size*1.18);
  ctx.setLineDash([]);
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(x,y+size*1.18+8,size,30);
  ctx.fillStyle=color;ctx.font="18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(msg,x+size/2,y+size*1.18+23);
  ctx.restore();
}

function assessFrame(lm,rgbStats,W,H){
  let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
  for(const p of lm){
    const x=p.x*W,y=p.y*H;
    if(x<xMin)xMin=x;if(x>xMax)xMax=x;if(y<yMin)yMin=y;if(y>yMax)yMax=y;
  }
  const faceW=xMax-xMin,faceH=yMax-yMin;
  const cx=(xMin+xMax)/2,cy=(yMin+yMax)/2;
  const guideSize=Math.min(W,H)*0.46;
  const targetW=guideSize;
  const ratio=faceW/targetW;
  const centered=Math.abs(cx-W/2)<W*0.12 && Math.abs(cy-H*0.48)<H*0.16;
  let faceState="ok",faceMsg="hold still";
  if(ratio<0.72){faceState="bad";faceMsg="move closer"}
  else if(ratio>1.18){faceState="bad";faceMsg="move farther"}
  else if(!centered){faceState="warn";faceMsg="center face"}

  let motion=0;
  if(lastFaceCenter){
    motion=Math.hypot(cx-lastFaceCenter.x,cy-lastFaceCenter.y)/Math.max(1,faceH);
  }
  lastFaceCenter={x:cx,y:cy};
  if(motion>0.035){faceState="warn";faceMsg="hold still"}

  const lightMean=(rgbStats.r+rgbStats.g+rgbStats.b)/3;
  let lightState="ok",lightMsg="light ok";
  if(lightMean<45){lightState="bad";lightMsg="more light"}
  else if(lightMean>225 || rgbStats.satRatio>0.025){lightState="bad";lightMsg="too bright"}
  else if(lightMean<70 || lightMean>205){lightState="warn";lightMsg="adjust light"}

  const fpsState=fpsEma>=27?"ok":fpsEma>=22?"warn":"bad";
  const ok=faceState!=="bad" && lightState!=="bad" && fpsState!=="bad";
  return{ok,faceState,faceMsg,lightState,lightMsg,fpsState,ratio,motion};
}

function drawWave(filt){
  const dpr=devicePixelRatio||1;
  const w=waveCvs.clientWidth;if(!w)return;
  const targetW=Math.round(w*dpr);
  const targetH=Math.round(waveCvs.clientHeight*dpr);
  if(waveCvs.width!==targetW||waveCvs.height!==targetH){
    waveCvs.width=targetW;
    waveCvs.height=targetH;
  }
  wctx.setTransform(dpr,0,0,dpr,0,0);
  wctx.fillStyle="#080c12";wctx.fillRect(0,0,w,waveCvs.clientHeight);
  wctx.strokeStyle="rgba(141,154,173,.13)";wctx.lineWidth=1;
  for(let i=1;i<4;i++){
    const y=(waveCvs.clientHeight/4)*i;
    wctx.beginPath();wctx.moveTo(0,y);wctx.lineTo(w,y);wctx.stroke();
  }
  const n=filt.length;if(n<2)return;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<n;i++){if(filt[i]<mn)mn=filt[i];if(filt[i]>mx)mx=filt[i]}
  const range=mx-mn||1,h=waveCvs.clientHeight,mid=h/2;
  wctx.beginPath();wctx.strokeStyle="#22d690";wctx.lineWidth=2;
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*w,y=mid-((filt[i]-mn)/range-.5)*(h*.8);
    i===0?wctx.moveTo(x,y):wctx.lineTo(x,y);
  }
  wctx.stroke();
}

function foreheadMask(lm,w,h){
  let xMin=Infinity,xMax=-Infinity;
  for(const p of lm){const x=p.x*w;if(x<xMin)xMin=x;if(x>xMax)xMax=x}
  const fw=xMax-xMin;
  const yBrow=(lm[105].y+lm[334].y)/2*h;
  const yChin=lm[152].y*h;
  const fh=Math.max(1,yChin-yBrow)*.55;
  const topY=yBrow-fh*.50,botY=yBrow-fh*.20;
  const cx=(xMin+xMax)/2;
  return[
    {x:cx-fw*.30,y:topY},{x:cx+fw*.30,y:topY},
    {x:cx+fw*.30,y:botY},{x:cx-fw*.30,y:botY}
  ];
}

function extractRGB(img,poly,w,h){
  const d=img.data;
  const xs=poly.map(p=>Math.round(p.x)),ys=poly.map(p=>Math.round(p.y));
  const x0=Math.max(0,Math.min(...xs)),x1=Math.min(w-1,Math.max(...xs));
  const y0=Math.max(0,Math.min(...ys)),y1=Math.min(h-1,Math.max(...ys));
  const ccx=(x0+x1)/2,ccy=(y0+y1)/2;
  const rx2=Math.max(1,((x1-x0)/2)**2),ry2=Math.max(1,((y1-y0)/2)**2);
  let sr=0,sg=0,sb=0,cnt=0,sat=0;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(((x-ccx)**2)/rx2+((y-ccy)**2)/ry2>1)continue;
    const i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2];
    sr+=r;sg+=g;sb+=b;cnt++;
    if(r>248||g>248||b>248||r<4||g<4||b<4)sat++;
  }
  if(!cnt)return{r:0,g:0,b:0,satRatio:1};
  return{r:sr/cnt,g:sg/cnt,b:sb/cnt,satRatio:sat/cnt};
}

function medianArr(arr){
  const s=arr.slice().sort((a,b)=>a-b);
  const m=s.length>>1;
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

function processFrame(info){
  if(!landmarker)return;
  try{
    const W=video.videoWidth,H=video.videoHeight;
    if(!W){video.requestVideoFrameCallback(processFrame);return}
    if(display.width!==W||display.height!==H){display.width=W;display.height=H;ext.width=W;ext.height=H}

    ctx.setTransform(-1,0,0,1,W,0);
    ctx.drawImage(video,0,0,W,H);
    ctx.setTransform(1,0,0,1,0,0);

    ectx.drawImage(video,0,0,W,H);
    const ts=performance.now();

    // FPS from real video frame timestamps
    const vts=info.mediaTime;
    if(prevVts!==null){
      const dt=vts-prevVts;
      if(dt>0) fpsEma=fpsEma*0.95+(1/dt)*0.05;
    }
    prevVts=vts;

    const res=landmarker.detectForVideo(ext,ts);

    if(!res.faceLandmarks||!res.faceLandmarks.length){
      markBpmStale();
      statusEl.textContent=isFinite(lastDisplayedBpm)
        ?"no face — last value may be outdated"
        :"no face — look at camera";
      setDetail("");
      setPill(facePill,"no face","bad");
      setPill(lightPill,"light","warn");
      setPill(fpsPill,`${fpsEma.toFixed(1)} fps`,fpsEma>=27?"ok":fpsEma>=22?"warn":"bad");
      setPill(signalPill,"signal","bad");
      drawFaceGuide(W,H,"bad","look at camera");
      lastFaceCenter=null;
      pendingBpm=NaN;
      smoothMask=null;
      video.requestVideoFrameCallback(processFrame);return;
    }

    const lm=res.faceLandmarks[0];
    const mask=smoothPoly(foreheadMask(lm,W,H));

    const rgb=extractRGB(ectx.getImageData(0,0,W,H),mask,W,H);
    const frameQuality=assessFrame(lm,rgb,W,H);
    const guideQuality=frameQuality.faceState==="bad"||frameQuality.lightState==="bad"||frameQuality.fpsState==="bad"
      ?"bad":frameQuality.faceState==="warn"||frameQuality.lightState==="warn"||frameQuality.fpsState==="warn"?"warn":"ok";
    drawFaceGuide(W,H,guideQuality,frameQuality.faceMsg);

    const roiColor=frameQuality.ok?"#00ff88":"#ffcc00";
    ctx.fillStyle=frameQuality.ok?"rgba(0,255,136,.22)":"rgba(255,204,0,.20)";
    ctx.strokeStyle=roiColor;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W-mask[0].x,mask[0].y);
    for(let i=1;i<mask.length;i++)ctx.lineTo(W-mask[i].x,mask[i].y);
    ctx.closePath();ctx.fill();ctx.stroke();

    const sampleTime=performance.now()/1000;
    if(frameQuality.ok){
      rawBuf.push({t:sampleTime,r:rgb.r,g:rgb.g,b:rgb.b});
      const keepAfter=sampleTime-(WIN_SEC+3);
      while(rawBuf.length && rawBuf[0].t<keepAfter)rawBuf.shift();
    }else{
      rawBuf=[];
      hrHistory=[];
      pendingBpm=NaN;
      smoothMask=null;
      markBpmStale();
      setDetail(isFinite(lastDisplayedBpm)?"last value is stale; waiting for stable signal":"");
    }
    totalFrames++;

    setPill(facePill,frameQuality.faceMsg,frameQuality.faceState);
    setPill(lightPill,frameQuality.lightMsg,frameQuality.lightState);
    setPill(fpsPill,`${fpsEma.toFixed(1)} fps`,frameQuality.fpsState);

    const bufferedSec=rawBuf.length>1?rawBuf[rawBuf.length-1].t-rawBuf[0].t:0;
    bufferMetric.textContent=`${Math.min(WIN_SEC,bufferedSec).toFixed(1)}s`;
    statusEl.textContent=frameQuality.ok
      ?`collecting stable frames… ${Math.min(WIN_SEC,bufferedSec).toFixed(1)}/${WIN_SEC}s`
      :isFinite(lastDisplayedBpm)
        ?`${frameQuality.faceMsg}; ${frameQuality.lightMsg} — last value may be outdated`
        :`${frameQuality.faceMsg}; ${frameQuality.lightMsg}`;
    setPill(signalPill,bufferedSec>=MIN_GOOD_SEC?"ready":"collecting",bufferedSec>=MIN_GOOD_SEC?"ok":"warn");

    // Compute HR roughly once per second once enough clean time is buffered.
    if(frameQuality.ok && bufferedSec>=MIN_GOOD_SEC && sampleTime-lastAnalysisAt>=1){
      lastAnalysisAt=sampleTime;
      const series=resampleUniform(rawBuf,FS,Math.min(WIN_SEC,bufferedSec));
      if(!series){video.requestVideoFrameCallback(processFrame);return}
      const R=series.R,G=series.G,B=series.B;

      let gMean=0;for(const v of G)gMean+=v;gMean/=G.length;
      let gVar=0;for(const v of G)gVar+=(v-gMean)**2;gVar/=G.length;
      const gCv=gMean>0?Math.sqrt(gVar)/gMean:0;

      const pulse=posSignal(R,G,B,POS_L);
      const d=detrend(pulse);
      const f=butterBpf(d,HR_LOW,HR_HIGH,FS);
      const recentPrior=sampleTime-lastGoodAt<PRIOR_TTL_SEC?lastGoodBpm:NaN;
      const pos=peakFreq(f,FS,HR_LOW,HR_HIGH,recentPrior);

      const chrom=chromSignal(R,G,B);
      const chromD=detrend(chrom);
      const chromF=butterBpf(chromD,HR_LOW,HR_HIGH,FS);
      const chromPeak=peakFreq(chromF,FS,HR_LOW,HR_HIGH,recentPrior);
      const chosen=chooseDisplayPeak(pos,chromPeak,recentPrior);
      let bpm=chosen.bpm,snr=chosen.snr;
      methodMetric.textContent=chosen.adjusted?"POS f/2":"POS";

      const chromReliable=isFinite(chromPeak.bpm)&&chromPeak.snr>=4;
      const chromSupports=chromReliable && Math.abs(chromPeak.bpm-bpm)<=12;
      const chromSupportsHalf=chromReliable && (
        Math.abs(chromPeak.bpm*2-bpm)<=10 ||
        Math.abs(chromPeak.bpm-bpm*2)<=10
      );
      const posBattle=pos.ambiguous&&isFinite(pos.rivalBpm)
        ?`${Math.round(pos.bpm)} vs ${Math.round(pos.rivalBpm)} bpm`
        :"";

      drawWave(f);

      const jumpOk=!isFinite(lastGoodBpm)||Math.abs(bpm-lastGoodBpm)<28||hrHistory.length<3;
      const firstNeedsConfirm=!isFinite(recentPrior);
      const pendingOk=isFinite(pendingBpm)&&Math.abs(bpm-pendingBpm)<=10&&sampleTime-pendingAt<18;
      const firstHighNeedsSubharmonicCheck=firstNeedsConfirm&&!chosen.adjusted&&bpm>95&&bpm/2>=HR_LOW*60;
      const ambiguous=!chosen.adjusted && (pos.ambiguous || (chromSupportsHalf && !isFinite(recentPrior)) || firstHighNeedsSubharmonicCheck);
      const ensembleOk=chosen.adjusted || chromSupports || !chromReliable || snr>chromPeak.snr*1.7;
      const canAccept=(!firstNeedsConfirm||pendingOk) && !ambiguous && ensembleOk;

      if(isFinite(bpm)&&bpm>=42&&bpm<=198&&snr>5&&gCv>0.001&&gCv<0.08&&jumpOk&&canAccept){
        hrHistory.push(bpm);
        if(hrHistory.length>15) hrHistory.shift();
        const stable=Math.round(medianArr(hrHistory));
        lastGoodBpm=stable;
        lastGoodAt=sampleTime;
        pendingBpm=NaN;
        showFreshBpm(stable);
        const correctionText=chosen.adjusted?"harmonic correction, ":"";
        statusEl.textContent=`heart rate: ${stable} bpm  (${correctionText}chrom:${uiBpm(chromPeak.bpm)} snr:${snr.toFixed(1)})`;
        setDetail(chosen.adjusted
          ?`accepted harmonic-corrected candidate: ${Math.round(chosen.bpm)} bpm`
          :`accepted: POS ${uiBpm(pos.bpm)} bpm, CHROM ${isFinite(chromPeak.bpm)?uiBpm(chromPeak.bpm)+" bpm":"weak"}`,"ok");
        setPill(signalPill,`snr ${snr.toFixed(1)}`,"ok");
        if(firstHr){firstHr=false;beep()}
      }else{
        if(firstNeedsConfirm&&isFinite(bpm)&&!ambiguous&&ensembleOk){
          pendingBpm=bpm;
          pendingAt=sampleTime;
        }
        let reason=!jumpOk?"unstable":snr<=5?"low signal":"waiting";
        let signalLabel=reason;
        if(ambiguous){
          const battle=pos.bpm>95?`${uiBpm(pos.bpm)} bpm harmonic check`:(posBattle||`${uiBpm(pos.bpm)} vs ${uiBpm(pos.bpm/2)} bpm`);
          const chromText=isFinite(chromPeak.bpm)?`pos ${battle}, chrom ${uiBpm(chromPeak.bpm)} bpm`:`pos ${battle}`;
          reason=`ambiguous: ${chromText}`;
          setDetail(`ambiguous candidates: ${chromText}`,"warn");
          signalLabel="ambiguous";
        }else if(firstNeedsConfirm&&!pendingOk&&isFinite(bpm)){
          reason=`confirming ${Math.round(bpm)} bpm`;
          setDetail(chosen.adjusted
            ?`confirming harmonic-corrected candidate: ${Math.round(bpm)} bpm`
            :`confirming candidate: ${Math.round(bpm)} bpm; waiting for next window`,"warn");
          signalLabel="confirming";
        }else if(!ensembleOk&&isFinite(chromPeak.bpm)){
          reason=`POS/CHROM disagree: ${uiBpm(pos.bpm)} vs ${uiBpm(chromPeak.bpm)} bpm`;
          setDetail(`POS/CHROM disagree: ${uiBpm(pos.bpm)} vs ${uiBpm(chromPeak.bpm)} bpm`,"warn");
          signalLabel="disagree";
        }else{
          setDetail(reason,"warn");
        }
        statusEl.textContent=`${reason}… (snr:${snr.toFixed(1)} cv:${(gCv*100).toFixed(2)}% ${fpsEma.toFixed(1)}fps)`;
        setPill(signalPill,signalLabel,"warn");
      }
    }
  }catch(e){console.warn("frame error:",e)}
  video.requestVideoFrameCallback(processFrame);
}

async function start(){
  startBtn.disabled=true;startBtn.textContent="loading…";
  try{
    const vis=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
    landmarker=await FaceLandmarker.createFromOptions(vis,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",numFaces:1
    });
    const stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}});
    video.srcObject=stream;await video.play();
    overlay.classList.add("hidden");
    statusEl.textContent="face detected — collecting frames…";
    video.requestVideoFrameCallback(processFrame);
  }catch(e){
    overlay.classList.remove("hidden");
    startBtn.textContent="Start";startBtn.disabled=false;
    statusEl.textContent="error: "+e.message;console.error(e);
  }
}
startBtn.addEventListener("click",start);
</script>
</body>
