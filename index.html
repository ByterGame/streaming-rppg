<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming rPPG — live heart rate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
.page{display:flex;flex-direction:column;width:100%;height:100%}
.video-wrap{position:relative;flex:1 1 0;min-height:0;background:#000;overflow:hidden}
#video{display:none}
#display{width:100%;height:100%;object-fit:contain}
.overlay-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#111;z-index:10}
#start-btn{padding:20px 60px;border:2px solid #00ff88;border-radius:12px;background:transparent;
  color:#00ff88;font-size:24px;cursor:pointer;transition:background .2s}
#start-btn:hover{background:rgba(0,255,136,.1)}
.overlay-msg.hidden{display:none}
.info{flex:0 0 auto;padding:16px 20px;background:#111;border-top:1px solid #222}
.hr-row{display:flex;align-items:baseline;gap:12px}
#hr-value{font-size:72px;font-weight:700;color:#00ff88;line-height:1;letter-spacing:-2px}
#hr-unit{font-size:20px;color:#666}
#status{margin-top:8px;font-size:14px;color:#666}
#waveform{width:100%;height:80px;margin-top:10px;background:#0a0a0a;border-radius:8px}
@media(max-height:600px){
  #hr-value{font-size:48px}#waveform{height:50px}.info{padding:10px 16px}
}
</style>
</head>
<body>
<div class="page">
  <div class="video-wrap">
    <video id="video" autoplay playsinline></video>
    <canvas id="display"></canvas>
    <div class="overlay-msg" id="overlay">
      <button id="start-btn">Start</button>
    </div>
  </div>
  <div class="info">
    <div class="hr-row">
      <span id="hr-value">--</span>
      <span id="hr-unit">bpm</span>
    </div>
    <div id="status">click Start to begin</div>
    <canvas id="waveform"></canvas>
  </div>
</div>

<script type="module">
import {
  FilesetResolver, FaceLandmarker,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

const video     = document.getElementById("video");
const display   = document.getElementById("display");
const overlay   = document.getElementById("overlay");
const startBtn  = document.getElementById("start-btn");
const hrValue   = document.getElementById("hr-value");
const statusEl  = document.getElementById("status");
const waveCvs   = document.getElementById("waveform");

const ctx  = display.getContext("2d", {willReadFrequently:true});
const wctx = waveCvs.getContext("2d");

const FS      = 30;
const WIN_SEC = 15;
const WIN     = FS * WIN_SEC;
const CHUNK   = 30;
const HR_LOW  = 0.7;
const HR_HIGH = 4.0;

let landmarker = null;
let lastTs     = -1;
let rawBuf     = [];
let posBuf     = [];
let frameCnt   = 0;
let firstHr    = true;
let audioCtx   = null;

const ext = document.createElement("canvas");
const ectx = ext.getContext("2d", {willReadFrequently:true});

function beep(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type="sine";o.frequency.value=880;
  g.gain.setValueAtTime(.3,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);
  o.start();o.stop(audioCtx.currentTime+.25);
}

function pos(r,g,b){
  const n=r.length;if(n<2)return[];
  let mR=0,mG=0,mB=0;
  for(let i=0;i<n;i++){mR+=r[i];mG+=g[i];mB+=b[i]}
  mR/=n;mG/=n;mB/=n;
  if(mR===0)mR=1;if(mG===0)mG=1;if(mB===0)mB=1;
  const s1=new Float64Array(n),s2=new Float64Array(n);
  for(let i=0;i<n;i++){
    const cR=r[i]/mR,cG=g[i]/mG,cB=b[i]/mB;
    s1[i]=cG-cB;s2[i]=cG+cB-2*cR;
  }
  let v1=0,v2=0;
  for(let i=0;i<n;i++){v1+=s1[i];v2+=s2[i]}
  const m1=v1/n,m2=v2/n;v1=0;v2=0;
  for(let i=0;i<n;i++){v1+=(s1[i]-m1)**2;v2+=(s2[i]-m2)**2}
  const sd1=Math.sqrt(v1/n),sd2=Math.sqrt(v2/n);
  const a=sd2>0?sd1/sd2:0;
  const out=new Float64Array(n);
  for(let i=0;i<n;i++)out[i]=s1[i]+a*s2[i];
  return out;
}

function detrend(x){
  const n=x.length;if(n<2)return x.slice();
  let sx=0,st=0,stt=0,sxt=0;
  for(let i=0;i<n;i++){sx+=x[i];st+=i;stt+=i*i;sxt+=i*x[i]}
  const d=n*stt-st*st;if(Math.abs(d)<1e-12)return x.slice();
  const a=(n*sxt-st*sx)/d,b=(stt*sx-st*sxt)/d;
  const y=new Float64Array(n);
  for(let i=0;i<n;i++)y[i]=x[i]-(a*i+b);
  return y;
}

function butterBpf(x,lo,hi,fs){
  const n=x.length;if(n<8)return x.slice();
  const w0=Math.PI*(lo+hi)/fs,bw=Math.PI*(hi-lo)/fs;
  const sinW=Math.sin(w0),cosW=Math.cos(w0),sinB=Math.sin(bw),alpha=sinB/2;
  const b0=alpha,b1=0,b2=-alpha,a0=1+alpha,a1=-2*cosW,a2=1-alpha;
  const sections=[{b0:b0/a0,b1:b1/a0,b2:b2/a0,a1:a1/a0,a2:a2/a0}];
  function biquad(v,s){
    const y=new Float64Array(n);
    let z1=0,z2=0;
    for(let i=0;i<n;i++){
      const t=v[i]-s.a1*z1-s.a2*z2;
      y[i]=s.b0*t+s.b1*z1+s.b2*z2;
      z2=z1;z1=t;
    }return y;
  }
  function cascade(v){for(const s of sections)v=biquad(v,s);return v}
  let y=cascade(x);
  const rev=new Float64Array(n);for(let i=0;i<n;i++)rev[i]=y[n-1-i];
  y=cascade(rev);
  const out=new Float64Array(n);for(let i=0;i<n;i++)out[i]=y[n-1-i];
  return out;
}

function fft(re,im){
  const N=re.length;
  for(let i=1,j=0;i<N;i++){
    let b=N>>1;for(;j&b;b>>=1)j^=b;j^=b;
    if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}
  }
  for(let len=2;len<=N;len*=2){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<N;i+=len){
      let cr=1,ci=0;
      for(let j=0;j<len/2;j++){
        const p=i+j,q=p+len/2;
        const ur=cr*re[q]-ci*im[q],ui=cr*im[q]+ci*re[q];
        re[q]=re[p]-ur;im[q]=im[p]-ui;
        re[p]+=ur;im[p]+=ui;
        const tr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=tr;
      }
    }
  }
}

function peakFreq(sig,fs,lo,hi){
  const N=1<<Math.ceil(Math.log2(sig.length));
  const re=new Float64Array(N),im=new Float64Array(N);
  for(let i=0;i<sig.length;i++)re[i]=sig[i];
  fft(re,im);
  const res=fs/N;
  const iLo=Math.max(1,Math.ceil(lo/res));
  const iHi=Math.min(N/2-1,Math.floor(hi/res));
  if(iLo>=iHi)return{bpm:NaN,mag:0};
  let pk=iLo;
  for(let i=iLo+1;i<=iHi;i++){
    if(re[i]*re[i]+im[i]*im[i]>re[pk]*re[pk]+im[pk]*im[pk])pk=i;
  }
  function goertzel(f){
    const w=2*Math.PI*f/fs,coeff=2*Math.cos(w);
    let s0=0,s1=0,s2=0;
    for(let i=0;i<sig.length;i++){s0=sig[i]+coeff*s1-s2;s2=s1;s1=s0}
    return s1*s1+s2*s2-coeff*s1*s2;
  }
  let fl=(pk-1)*res,fh=(pk+1)*res;
  for(let k=0;k<10;k++){
    const m1=fl+(fh-fl)/3,m2=fh-(fh-fl)/3;
    if(goertzel(m1)>goertzel(m2))fh=m2;else fl=m1;
  }
  const fPeak=(fl+fh)/2;
  return{bpm:fPeak*60,mag:Math.sqrt(re[pk]*re[pk]+im[pk]*im[pk])};
}

function drawWave(filt){
  const dpr=devicePixelRatio||1;
  const w=waveCvs.clientWidth;if(!w)return;
  waveCvs.width=w*dpr;waveCvs.height=waveCvs.clientHeight*dpr;
  wctx.setTransform(dpr,0,0,dpr,0,0);
  wctx.fillStyle="#0a0a0a";wctx.fillRect(0,0,w,waveCvs.clientHeight);
  const n=filt.length;if(n<2)return;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<n;i++){if(filt[i]<mn)mn=filt[i];if(filt[i]>mx)mx=filt[i]}
  const range=mx-mn||1,h=waveCvs.clientHeight,mid=h/2;
  wctx.beginPath();wctx.strokeStyle="#00ff88";wctx.lineWidth=1.5;
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*w,y=mid-((filt[i]-mn)/range-.5)*(h*.8);
    i===0?wctx.moveTo(x,y):wctx.lineTo(x,y);
  }
  wctx.stroke();
}

function foreheadMask(lm,w,h){
  let xMin=Infinity,xMax=-Infinity;
  for(const p of lm){const x=p.x*w;if(x<xMin)xMin=x;if(x>xMax)xMax=x}
  const fw=xMax-xMin;
  const yBrow=(lm[105].y+lm[334].y)/2*h;
  const yChin=lm[152].y*h;
  const fh=Math.max(1,yChin-yBrow)*.55;
  const topY=yBrow-fh*.53,botY=yBrow-fh*.15;
  const cx=(xMin+xMax)/2;
  return[
    {x:cx-fw*.36,y:topY},{x:cx+fw*.36,y:topY},
    {x:cx+fw*.36,y:botY},{x:cx-fw*.36,y:botY}
  ];
}

function extractRGB(img,poly,w,h){
  const d=img.data;
  const xs=poly.map(p=>Math.round(p.x)),ys=poly.map(p=>Math.round(p.y));
  const x0=Math.max(0,Math.min(...xs)),x1=Math.min(w-1,Math.max(...xs));
  const y0=Math.max(0,Math.min(...ys)),y1=Math.min(h-1,Math.max(...ys));
  const ccx=(x0+x1)/2,ccy=(y0+y1)/2;
  const rx2=Math.max(1,((x1-x0)/2)**2),ry2=Math.max(1,((y1-y0)/2)**2);
  let sr=0,sg=0,sb=0,cnt=0;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(((x-ccx)**2)/rx2+((y-ccy)**2)/ry2>1)continue;
    const i=(y*w+x)*4;sr+=d[i];sg+=d[i+1];sb+=d[i+2];cnt++;
  }
  if(!cnt)return{r:0,g:0,b:0};
  return{r:sr/cnt/255,g:sg/cnt/255,b:sb/cnt/255};
}

async function processFrame(){
  if(!landmarker||!video.videoWidth){requestAnimationFrame(processFrame);return}
  try{
    const W=video.videoWidth,H=video.videoHeight;
    if(display.width!==W){display.width=W;display.height=H;ext.width=W;ext.height=H}

    ctx.setTransform(-1,0,0,1,W,0);
    ctx.drawImage(video,0,0,W,H);
    ctx.setTransform(1,0,0,1,0,0);

    ectx.drawImage(video,0,0,W,H);
    const ts=performance.now();
    if(ts===lastTs){requestAnimationFrame(processFrame);return}
    lastTs=ts;
    const res=landmarker.detectForVideo(ext,ts);

    if(!res.faceLandmarks||!res.faceLandmarks.length){
      statusEl.textContent="no face — look at camera";
      requestAnimationFrame(processFrame);return;
    }

    const lm=res.faceLandmarks[0];
    const mask=foreheadMask(lm,W,H);

    ctx.fillStyle="rgba(0,255,136,.25)";ctx.strokeStyle="#00ff88";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(mask[0].x,mask[0].y);
    for(let i=1;i<mask.length;i++)ctx.lineTo(mask[i].x,mask[i].y);
    ctx.closePath();ctx.fill();ctx.stroke();

    const rgb=extractRGB(ectx.getImageData(0,0,W,H),mask,W,H);
    rawBuf.push([rgb.r,rgb.g,rgb.b]);
    if(++frameCnt>=CHUNK){
      frameCnt=0;
      const end=rawBuf.length,start=Math.max(0,end-WIN);
      const rr=[],gg=[],bb=[];
      for(let i=start;i<end;i++){rr.push(rawBuf[i][0]);gg.push(rawBuf[i][1]);bb.push(rawBuf[i][2])}
      posBuf=pos(rr,gg,bb);
      if(rawBuf.length>WIN*2)rawBuf.splice(0,rawBuf.length-WIN);
      statusEl.textContent="measuring…";

      if(posBuf.length>=WIN){
        const w=posBuf.slice(-WIN);
        const d=detrend(w);
        const f=butterBpf(d,HR_LOW,HR_HIGH,FS);
        const r=peakFreq(f,FS,HR_LOW,HR_HIGH);
        if(isFinite(r.bpm)&&r.bpm>=42&&r.bpm<=240){
          const bpm=Math.round(r.bpm);
          hrValue.textContent=bpm;
          statusEl.textContent="heart rate: "+bpm+" bpm";
          drawWave(f);
          if(firstHr){firstHr=false;beep()}
        }
      }
    }
  }catch(e){console.warn("frame error:",e)}
  requestAnimationFrame(processFrame);
}

async function start(){
  startBtn.disabled=true;startBtn.textContent="loading…";
  try{
    const vis=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
    landmarker=await FaceLandmarker.createFromOptions(vis,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",numFaces:1
    });
    const stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}});
    video.srcObject=stream;await video.play();
    overlay.classList.add("hidden");
    statusEl.textContent="face detected — measuring…";
    processFrame();
  }catch(e){
    overlay.classList.remove("hidden");
    startBtn.textContent="Start";startBtn.disabled=false;
    statusEl.textContent="error: "+e.message;console.error(e);
  }
}
startBtn.addEventListener("click",start);
</script>
</body>
</html>
